<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MorphRing history</title>
    <link rel="stylesheet" href="settings.css" />
    <style>
      /* History-only bits; the basics come from settings.css. */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      header h1 {
        margin: 0;
      }
      #history {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .job {
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        padding: 10px 0;
      }
      .job-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
      }
      .job-label {
        font-weight: 600;
      }
      .job-time,
      .job-counts {
        opacity: 0.7;
        font-size: 13px;
      }
      .job-state {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      .job-state.completed {
        color: #2e8b57;
      }
      .job-state.completedwitherrors {
        color: #c88a00;
      }
      .job-state.failed {
        color: #d0453a;
      }
      .job-outputs,
      .job-failures {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        font-size: 13px;
      }
      .job-outputs button {
        all: unset;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        word-break: break-all;
      }
      .job-outputs button:focus-visible {
        outline: 2px solid Highlight;
      }
      .job-failures li {
        color: #d0453a;
        word-break: break-all;
      }
      #empty,
      #error {
        opacity: 0.7;
      }
    </style>
    <script src="history.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>History</h1>
        <button id="clear" type="button" disabled>Clear</button>
      </header>
      <p id="empty" hidden>No conversions yet.</p>
      <p id="error" hidden></p>
      <ol id="history"></ol>
    </main>
  </body>
</html>
