# CI for the root workspace (core, engines, cli, platform) and the Tauri app,
# which is its own workspace (PLAN.md D1) and gets its own matrix at the bottom.
#
# Both `test` and `app` run on Linux, Windows and macOS with real engines
# installed, so every later XP task gets an honest cross-OS signal instead of
# a shrug. As of v0.2 all three OSes block (this supersedes D11, which let
# Windows and macOS merely inform): a red Windows run is now a red run. The
# only jobs still allowed to fail are deny-advisories and goldens-office.
# Every cargo call uses --locked (D12): if Cargo.lock is stale, CI should say
# so instead of quietly rewriting it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The action installs stable, then rust-toolchain.toml gets the final say.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --workspace is safe because app/ is excluded (D1).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # Every OS gates now. Windows and macOS spent v0.1 tattling; in v0.2
    # they got the badge (XP-14), so a red run here is a red run, full stop.
    env:
      # The ImageMagick AppImage wants FUSE, which the runner does not lend
      # out. This makes it unpack itself into /tmp and run from there instead,
      # at the cost of about a tenth of a second per call. Other OSes ignore it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            timeout: 15
          - os: macos-latest
            timeout: 15
          # Windows compiles like it is paid by the hour, so it gets ten more minutes.
          - os: windows-latest
            timeout: 25
    steps:
      - uses: actions/checkout@v4

      # Runner images move under our feet; the log should say which one we got.
      - name: Runner info (Linux)
        if: runner.os == 'Linux'
        run: |
          lsb_release -a
          uname -m
      - name: Runner info (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
      - name: Runner info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Environment]::OSVersion
          $env:PROCESSOR_ARCHITECTURE

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Engines, one OS at a time. Every version gets printed so a red test can
      # be blamed on the right binary. No LibreOffice here: it would eat the
      # whole time budget for breakfast, so it dines alone in goldens-office (D7).
      - name: Install engines (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils ghostscript pandoc
          ffmpeg -hide_banner -version | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          gs --version
          pandoc --version | head -n 1

      # apt only has ImageMagick 6, which has no `magick` at all, so we take
      # the official AppImage from a pinned GitHub release instead. Release
      # assets stay put, unlike imagemagick.org/archive/binaries, which keeps
      # exactly one build and deletes yesterday's. It is ~33 MB and arrives in
      # seconds, so no cache: one more moving part would cost more than it saves.
      # Bumping the tag means bumping the hash too; `gh release view <tag> -R
      # ImageMagick/ImageMagick --json assets` prints both.
      - name: Install ImageMagick 7 (Linux)
        if: runner.os == 'Linux'
        env:
          IM_TAG: 7.1.2-32
          IM_SHA256: d456cab221b5fc1c396768a026d0a33ee8665f7119c7fea7151b960c69058b21
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/magick.AppImage" \
            "https://github.com/ImageMagick/ImageMagick/releases/download/$IM_TAG/ImageMagick-$IM_TAG-gcc-x86_64.AppImage"
          echo "$IM_SHA256  $RUNNER_TEMP/magick.AppImage" | sha256sum -c -
          install -m 0755 "$RUNNER_TEMP/magick.AppImage" "$HOME/.local/bin/magick"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/magick" -version

      - name: Install engines (macOS)
        if: runner.os == 'macOS'
        env:
          # Homebrew loves to tidy the whole house when asked to fetch one thing.
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install ffmpeg imagemagick poppler ghostscript pandoc
          ffmpeg -hide_banner -version | head -n 1
          magick -version | head -n 1
          pdftoppm -v 2>&1 | head -n 1
          gs --version
          pandoc --version | head -n 1

      - name: Install engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # A hung installer should cost us ten minutes, not the whole job.
        timeout-minutes: 10
        env:
          GS_TAG: gs10080
        run: |
          choco install ffmpeg pandoc -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ghostscript refuses to be installed quietly on a runner: choco's
          # package sat for 24 minutes, and Artifex's own installer with /S
          # sat for 10 more. So we skip installing altogether and let 7-Zip
          # (preinstalled) unpack the NSIS payload. Nobody can hang on a dialog
          # that never opens.
          $exe = Join-Path $env:RUNNER_TEMP "$env:GS_TAG-w64.exe"
          $dir = Join-Path $env:RUNNER_TEMP "ghostscript"
          Invoke-WebRequest "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/$env:GS_TAG/${env:GS_TAG}w64.exe" -OutFile $exe
          7z x $exe "-o$dir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "Could not unpack Ghostscript"; exit 1 }
          $gsBin = (Get-ChildItem $dir -Recurse -Filter gswin64c.exe | Select-Object -First 1).DirectoryName
          if (-not $gsBin) { Write-Host "gswin64c.exe not found in the Ghostscript payload"; exit 1 }
          # Chocolatey shims and gs land here; later steps only see them via GITHUB_PATH.
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
          echo "$gsBin" >> $env:GITHUB_PATH
          $env:Path = "C:\ProgramData\chocolatey\bin;$gsBin;$env:Path"
          # ImageMagick 7 ships with the image, so we only say hello.
          magick -version
          ffmpeg -hide_banner -version | Select-Object -First 1
          pandoc --version | Select-Object -First 1
          gswin64c --version

      # --no-fail-fast so one broken crate does not hide the others' failures.
      - run: cargo test --workspace --locked --no-fail-fast

      # A golden test that skips still passes, which is lovely for laptops and
      # useless for CI. Run the magick goldens again (already built, so it is
      # a second or two) with output on, and go red if any of them chickened out.
      - name: magick goldens ran (Linux)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo test -p morphring-engines --locked --test magick -- --nocapture 2>&1 | tee "$RUNNER_TEMP/magick.log"
          if grep -q '^SKIP:' "$RUNNER_TEMP/magick.log"; then
            echo "::error::magick golden tests skipped"
            exit 1
          fi

  # LibreOffice gets a job of its own: installing it takes minutes and its
  # first start is slower than a Monday, and none of that should hold the main
  # test job hostage (D7). It informs, it does not block.
  goldens-office:
    name: goldens-office
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui
          soffice --version
      # Same trick as the magick goldens: output on, and a SKIP counts as a failure.
      - name: soffice goldens
        run: |
          set -o pipefail
          cargo test -p morphring-engines --locked --test soffice -- --nocapture 2>&1 | tee "$RUNNER_TEMP/soffice.log"
          cargo test -p morphring --locked --test convert -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/soffice.log"
          if grep -q '^SKIP: soffice' "$RUNNER_TEMP/soffice.log"; then
            echo "::error::soffice golden tests skipped"
            exit 1
          fi

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Blocking: if Cargo.toml promises a rust-version, this job holds us to
    # it. Breaking the promise means bumping it on purpose, not by accident.
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version
        id: msrv
        run: |
          ver=$(grep -m1 -E '^rust-version *= *"' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$ver" ]; then echo "rust-version not found in Cargo.toml"; exit 1; fi
          echo "MSRV: $ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The explicit +<ver> outranks rust-toolchain.toml, which would
      # otherwise drag us straight back to stable.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked --all-targets

  deny-licenses:
    name: deny-licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  deny-advisories:
    name: deny-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A RUSTSEC notice published this afternoon should not turn a tag red
    # without a single line of our code changing (D11). We read it, we don't block on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # All three OSes block, same as `test`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            timeout: 15
          - os: macos-latest
            timeout: 15
          - os: windows-latest
            timeout: 25
    steps:
      - uses: actions/checkout@v4

      - name: Runner info (Linux)
        if: runner.os == 'Linux'
        run: |
          lsb_release -a
          uname -m
      - name: Runner info (macOS)
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
      - name: Runner info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [Environment]::OSVersion
          $env:PROCESSOR_ARCHITECTURE

      # Windows brings WebView2 and macOS brings WKWebView; only Linux has to
      # assemble its own webview from parts.
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: clippy (app)
        run: cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: test (app)
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml
      # Node 24 treats a bare directory as a file to run (and fails), so we
      # hand it a glob instead; node expands it itself, quotes keep every shell out of it.
      - name: test (ring UI)
        run: node --test "app/ui/*.test.mjs"
