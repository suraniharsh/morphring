# Categories for GitHub's auto-generated release notes ("What's Changed").
# Each merged pull request lands under the first category whose label it carries,
# so the order below is also the pecking order. Label it skip-changelog and it
# quietly disappears, like a temp file after a successful conversion.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Engines
      labels:
        - engine
        - formats
    - title: Docs
      labels:
        - documentation
        - docs
    - title: Build and maintenance
      labels:
        - build
        - ci
        - dependencies
        - chore
    - title: Other changes
      labels:
        - "*"
